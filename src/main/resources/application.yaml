spring:
  application:
    name: user-management
  # ---- Default profile: in-memory H2 (PostgreSQL compatibility mode) ----
  datasource:
    url: jdbc:h2:mem:usermgmt;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        show_sql: true
  flyway:
    enabled: true
    # schema migrations + sample data (sample data is NOT loaded in the postgres profile)
    locations: classpath:db/migration,classpath:db/sample-data

  mvc:
    problemdetails:
      enabled: true

  threads:
    virtual:
      enabled: true
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
