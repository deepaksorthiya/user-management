# Activate with: --spring.profiles.active=postgres
# Secrets and connection details come from environment variables.
spring:
  datasource:
    # reWriteBatchedInserts: the driver rewrites JDBC batches into multi-row INSERTs (big win for bulk writes)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testdb}?reWriteBatchedInserts=true&ApplicationName=user-management
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_SIZE:20}
      leak-detection-threshold: 20000   # logs a stack trace for connections held > 20 s
  jpa:
    properties:
      # Client-side cap for every Hibernate query (ms). Applies to the app only, so Flyway
      # (long-running CREATE INDEX CONCURRENTLY) is not affected.
      jakarta.persistence.query.timeout: 10000
  flyway:
    # schema + PostgreSQL-only migrations (trigram indexes); no sample data
    locations: classpath:db/migration,classpath:db/postgres