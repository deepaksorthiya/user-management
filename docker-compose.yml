# Local PostgreSQL for the "postgres" profile:
#   docker compose up -d
#   DB_PASSWORD=usermgmt mvn spring-boot:run -Dspring-boot.run.profiles=postgres
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: usermgmt
      POSTGRES_USER: usermgmt
      POSTGRES_PASSWORD: ${DB_PASSWORD:-usermgmt}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usermgmt -d usermgmt"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
